<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="status-line">
        <span id="status-model" class="status-indicator"></span>
        <span id="status-program" class="status-indicator"></span>
        <span id="save-status" class="status-indicator save-status" role="status" aria-live="polite"></span>
      </div>
      <div class="trace-picker">
        <select id="trace-select" aria-label="Trace"></select>
        <button id="trace-rename" type="button" title="Rename trace" aria-label="Rename trace"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l11.1-11.1a2.1 2.1 0 0 0-3-3L5 17v3Z"/><path d="m14.7 7.3 3 3"/></svg></button>
      </div>
      <div class="topbar-actions">
        <label class="topbar-switch" title="On: API generates blue drafts. Off: the bound Codex session drafts them.">
          <input id="api-mode" type="checkbox" role="switch" aria-label="API drafts">
          <span>API</span>
        </label>
        <label class="topbar-switch">
          <input id="auto-mode" type="checkbox" role="switch" aria-label="Auto">
          <span>Auto</span>
        </label>
        <label class="topbar-switch">
          <input id="collapse-all" type="checkbox" aria-label="Collapse all bubbles">
          <span>Collapse</span>
        </label>
        <div id="view-mode" class="view-mode" role="group" aria-label="Message view" data-mode="raw">
          <button type="button" data-view="raw" aria-pressed="true">Raw</button>
          <button type="button" data-view="rendered" aria-pressed="false">Rendered</button>
        </div>
      </div>
    </header>
    <div id="notice" class="notice" hidden></div>
    <div class="stream-frame">
      <nav id="scroll-rail" class="scroll-rail" aria-label="Conversation map">
        <div id="rail-track" class="rail-track">
          <div id="rail-segments" class="rail-segments" aria-hidden="true"></div>
          <div id="rail-thumb" class="rail-thumb" aria-hidden="true"></div>
          <div id="rail-points" class="rail-points"></div>
        </div>
      </nav>
      <div id="stream" class="stream" aria-live="polite">
        <details id="request-context" class="request-context" open>
          <summary>System prompt &amp; settings</summary>
          <div id="request-context-body" class="request-context-body"></div>
        </details>
        <hr class="context-divider">
        <div id="messages"></div>
      </div>
    </div>
  </main>
  <dialog id="swap-dialog" class="swap-dialog" aria-labelledby="swap-title">
    <form id="swap-form">
      <div id="swap-title" class="swap-title">Replace response</div>
      <div id="swap-detail" class="swap-detail"></div>
      <label for="swap-model">OpenRouter model</label>
      <input id="swap-model" name="model" list="swap-models" autocomplete="off" spellcheck="false" required>
      <datalist id="swap-models"><option value="z-ai/glm-5.3"><option value="z-ai/glm-5.3-flash"></datalist>
      <div id="swap-error" class="swap-error" role="alert" hidden></div>
      <div class="swap-actions"><button type="button" id="swap-cancel">Cancel</button><button type="submit" id="swap-submit">Replace</button></div>
    </form>
  </dialog>
  <script src="/app.js"></script>
</body>
</html>
