<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div id="save-status" class="save-status" role="status" aria-live="polite"></div>
      <div id="model-name" class="model-name"></div>
      <div class="topbar-actions">
        <label class="auto-switch" title="Allow the auditor to send this session's drafts without a tap">
          <input id="auto-mode" type="checkbox" aria-label="Auto send">
          <span>Auto</span>
        </label>
        <div id="view-mode" class="view-mode" role="group" aria-label="Message view" data-mode="raw">
          <button type="button" data-view="raw" aria-pressed="true">Raw</button>
          <button type="button" data-view="rendered" aria-pressed="false">Rendered</button>
        </div>
      </div>
    </header>
    <div id="notice" class="notice" hidden></div>
    <div id="stream" class="stream" aria-live="polite"></div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
