<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="status-line">
        <span id="save-status" class="status-indicator save-status" role="status" aria-live="polite"></span>
      </div>
      <div class="trace-picker">
        <button id="trace-select" class="trace-select" type="button" aria-label="Select trace" aria-controls="trace-menu" aria-expanded="false"><span id="trace-current"></span><svg class="trace-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 6 4.5 4 4.5-4"/></svg></button>
        <div id="trace-menu" class="trace-menu" role="group" aria-label="Traces" hidden></div>
      </div>
      <div class="topbar-actions">
        <div id="view-mode" class="view-mode" role="group" aria-label="Message view" data-mode="raw">
          <button type="button" data-view="raw" aria-pressed="true">Raw</button>
          <button type="button" data-view="rendered" aria-pressed="false">Rendered</button>
        </div>
        <div class="settings-wrap">
          <button id="settings-button" class="settings-button" type="button" aria-label="Settings" aria-controls="settings-panel" aria-expanded="false" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.2 2.8h3.6l.5 2.2c.5.2 1 .4 1.5.6l1.9-1.2 2.6 2.6-1.2 1.9c.3.5.5 1 .6 1.5l2.2.5v3.6l-2.2.5c-.2.5-.4 1-.6 1.5l1.2 1.9-2.6 2.6-1.9-1.2c-.5.3-1 .5-1.5.6l-.5 2.2h-3.6l-.5-2.2c-.5-.2-1-.4-1.5-.6l-1.9 1.2-2.6-2.6 1.2-1.9c-.3-.5-.5-1-.6-1.5l-2.2-.5v-3.6l2.2-.5c.2-.5.4-1 .6-1.5L3.7 7l2.6-2.6 1.9 1.2c.5-.3 1-.5 1.5-.6l.5-2.2Z"/><circle cx="12" cy="12" r="3"/></svg></button>
          <div id="settings-panel" class="settings-panel" hidden>
            <div class="settings-row"><span>Draft with</span><div id="draft-source-control" class="view-mode source-mode" role="group" aria-label="Draft with" data-mode="codex"><button type="button" data-source="codex" aria-pressed="true">Agent</button><button type="button" data-source="api" aria-pressed="false">API</button></div></div>
            <label class="settings-row topbar-switch"><span>Auto-approve</span><input id="auto-mode" type="checkbox" role="switch" aria-label="Auto-approve"></label>
            <label class="settings-row topbar-switch"><span>Auto-generate</span><input id="auto-generate" type="checkbox" role="switch" aria-label="Auto-generate blue drafts"></label>
            <label class="settings-row topbar-switch settings-divider"><span>Collapse messages</span><input id="collapse-all" type="checkbox" role="switch" aria-label="Collapse messages"></label>
            <div class="settings-models">
              <div class="settings-models-title">Default model</div>
              <div id="default-model-options" class="settings-model-options" role="group" aria-label="Default model"></div>
            </div>
          </div>
        </div>
      </div>
    </header>
    <div id="notice" class="notice" hidden><span id="notice-content"></span><button id="notice-dismiss" type="button" aria-label="Dismiss notice" title="Dismiss"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6 18 18M18 6 6 18"/></svg></button></div>
    <div class="stream-frame">
      <nav id="scroll-rail" class="scroll-rail" aria-label="Conversation map: red tools, green messages, orange mixed">
        <div id="rail-track" class="rail-track">
          <div id="rail-segments" class="rail-segments" aria-hidden="true"></div>
          <div id="rail-thumb" class="rail-thumb" aria-hidden="true"></div>
          <div id="rail-points" class="rail-points"></div>
        </div>
        <div class="rail-key" aria-hidden="true"><span><i class="tool"></i>Tools</span><span><i class="chat"></i>Messages</span><span><i class="mixed"></i>Mixed</span></div>
      </nav>
      <div id="stream" class="stream" aria-live="polite">
        <details id="request-context" class="request-context" open>
          <summary>System prompt &amp; settings</summary>
          <div id="request-context-body" class="request-context-body"></div>
        </details>
        <hr class="context-divider">
        <div id="messages"></div>
      </div>
    </div>
  </main>
  <dialog id="trace-rename-dialog" class="swap-dialog trace-rename-dialog" aria-labelledby="trace-rename-title">
    <form id="trace-rename-form">
      <div id="trace-rename-title" class="swap-title">Rename trace</div>
      <label class="trace-rename-label" for="trace-rename-input">Name</label>
      <input id="trace-rename-input" type="text" maxlength="160" autocomplete="off" required>
      <div id="trace-rename-error" class="swap-error" role="alert" hidden></div>
      <div class="swap-actions"><button id="trace-rename-cancel" type="button">Cancel</button><button id="trace-rename-save" type="submit">Save</button></div>
    </form>
  </dialog>
  <dialog id="swap-dialog" class="swap-dialog" aria-labelledby="swap-title">
    <form id="swap-form">
      <div id="swap-title" class="swap-title">Replace response</div>
      <div id="swap-existing">
        <div id="swap-variants" class="swap-options" role="radiogroup" aria-label="Generated responses"></div>
        <button id="swap-new" class="swap-new" type="button"><span class="swap-new-plus" aria-hidden="true">+</span><span id="swap-new-label">New response</span></button>
      </div>
      <div id="swap-generate" hidden>
        <button id="swap-back" class="swap-back" type="button">‹ Responses</button>
        <div id="swap-options" class="swap-options" role="radiogroup" aria-label="Model"></div>
        <div id="swap-key-field" class="swap-key-field" hidden><label for="swap-key">OpenRouter API key</label><input id="swap-key" type="password" autocomplete="off" spellcheck="false"></div>
      </div>
      <div id="swap-error" class="swap-error" role="alert" hidden></div>
      <div class="swap-actions"><button type="button" id="swap-cancel">Cancel</button><button type="submit" id="swap-submit">Use version</button></div>
    </form>
  </dialog>
  <dialog id="manual-dialog" class="swap-dialog manual-dialog" aria-labelledby="manual-title">
    <form id="manual-form">
      <div id="manual-title" class="swap-title"></div>
      <div id="manual-template-picker" class="manual-template-picker" hidden>
        <button id="manual-template" class="manual-template-trigger" type="button" aria-label="Message template" aria-controls="manual-template-menu" aria-expanded="false"><span id="manual-template-label">No template</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 6 4.5 4 4.5-4"/></svg></button>
        <div id="manual-template-menu" class="manual-template-menu" role="menu" aria-label="Message templates" hidden></div>
      </div>
      <div id="manual-parts" class="manual-parts"></div>
      <div class="manual-add">
        <button id="manual-add-message" type="button"></button>
        <button id="manual-add-tool" type="button"></button>
      </div>
      <div id="manual-warning" role="status" hidden></div>
      <div id="manual-error" class="swap-error" role="alert" hidden></div>
      <div class="swap-actions"><button id="manual-cancel" type="button">Cancel</button><button id="manual-submit" type="submit">Create</button></div>
    </form>
  </dialog>
  <dialog id="bookmark-dialog" class="swap-dialog bookmark-dialog" aria-labelledby="bookmark-title">
    <form id="bookmark-form">
      <div id="bookmark-title" class="swap-title">Bookmark</div>
      <input id="bookmark-label" aria-label="Bookmark label" maxlength="80" autocomplete="off" spellcheck="false">
      <div id="bookmark-error" class="swap-error" role="alert" hidden></div>
      <div class="swap-actions"><button id="bookmark-remove" type="button" hidden>Remove</button><button id="bookmark-cancel" type="button">Cancel</button><button id="bookmark-save" type="submit">Save</button></div>
    </form>
  </dialog>
  <dialog id="rewind-dialog" class="swap-dialog rewind-dialog" aria-labelledby="rewind-title" aria-describedby="rewind-detail">
    <form method="dialog">
      <div id="rewind-title" class="swap-title"></div>
      <p id="rewind-detail"></p>
      <div class="swap-actions"><button type="submit" value="cancel">Cancel</button><button id="rewind-confirm" class="destructive" type="submit" value="rewind">Delete messages</button></div>
    </form>
  </dialog>
  <script src="/app.js"></script>
</body>
</html>
